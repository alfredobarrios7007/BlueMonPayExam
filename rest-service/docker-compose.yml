services:
  rest-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: rest-service:local
    ports:
      - "8080:8080"
    environment:
      # The mntCustomData service is assumed to run on the host machine (localhost:4501
      # from the host's point of view). host.docker.internal resolves to the host from
      # inside the container on Docker Desktop (Windows/Mac); extra_hosts below makes
      # it resolve on Linux too.
      MNT_CUSTOM_DATA_URL: "http://host.docker.internal:4501"
      MNT_CUSTOM_DATA_LOG_DIR: "/deployments/logs"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persists the mntCustomData.log audit trail to a local directory on the host.
      - ./logs:/deployments/logs
